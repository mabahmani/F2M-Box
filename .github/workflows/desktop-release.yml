name: Desktop Release

# Builds native desktop installers on macOS (arm64 + Intel), Windows, and Linux.
# Pushing a v* tag publishes a GitHub Release with all artifacts attached.
# workflow_dispatch uploads artifacts only (no Release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache downloaded libVLC
        uses: actions/cache@v4
        with:
          path: desktop/build/vlc-cache
          key: vlc-3.0.23-${{ matrix.artifact }}-${{ hashFiles('desktop/build.gradle.kts') }}
          restore-keys: |
            vlc-3.0.23-${{ matrix.artifact }}-
            vlc-3.0.23-

      - name: Install packaging deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install WiX (Windows MSI/EXE)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Package release installer
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx3g
        run: ./gradlew :desktop:packageReleaseDistributionForCurrentOS --console=plain --stacktrace

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for dir in dmg msi exe deb; do
            for f in desktop/build/compose/binaries/main/$dir/*; do
              [ -f "$f" ] && cp "$f" "dist/F2MBox-${{ matrix.artifact }}-$(basename "$f")"
            done
          done
          echo "Collected:"; ls -la dist
          test -n "$(ls -A dist 2>/dev/null)" || { echo "No installer produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true